services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:?Missing NEXT_PUBLIC_FIREBASE_API_KEY in .env}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?Missing NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN in .env}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?Missing NEXT_PUBLIC_FIREBASE_PROJECT_ID in .env}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:?Missing NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET in .env}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:?Missing NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID in .env}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID:?Missing NEXT_PUBLIC_FIREBASE_APP_ID in .env}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?Missing NEXT_PUBLIC_API_URL in .env}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    env_file:
      - .env
    environment:
      # Docker Compose will refuse to start if any of these are missing or empty.
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:?Missing FIREBASE_CREDENTIALS_PATH in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:?Missing CORS_ORIGINS in .env}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_BASIC=${STRIPE_PRICE_BASIC:-}
      - STRIPE_PRICE_PREMIUM=${STRIPE_PRICE_PREMIUM:-}
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SECRET=${INTERNAL_SECRET:?Missing INTERNAL_SECRET in .env}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    command: ["uv", "run", "arq", "app.worker.settings.WorkerSettings"]
    volumes:
      - ./server:/app
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    env_file:
      - .env
    environment:
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:?}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - REDIS_URL=redis://redis:6379
      - API_BASE_URL=http://server:8000
      - INTERNAL_SECRET=${INTERNAL_SECRET:?Missing INTERNAL_SECRET}
    depends_on:
      - redis
      - server

volumes:
  redis_data:
