services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:?Missing NEXT_PUBLIC_API_URL in .env}
      - NEXT_PUBLIC_FRONTEND_URL=${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:3000}
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    env_file:
      - .env
    environment:
      # Docker Compose will refuse to start if any of these are missing or empty.
      - DATABASE_URL=mysql://onb:${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD in .env}@mysql:3306/onb
      - JWT_SECRET=${JWT_SECRET:?Missing JWT_SECRET in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:?Missing CORS_ORIGINS in .env}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SECRET=${INTERNAL_SECRET:?Missing INTERNAL_SECRET in .env}
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9000}
      - S3_BUCKET=onb
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    command: ["uv", "run", "arq", "app.worker.settings.WorkerSettings"]
    volumes:
      - ./server:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql://onb:${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD in .env}@mysql:3306/onb
      - JWT_SECRET=${JWT_SECRET:?Missing JWT_SECRET in .env}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - REDIS_URL=redis://redis:6379
      - API_BASE_URL=http://server:8000
      - INTERNAL_SECRET=${INTERNAL_SECRET:?Missing INTERNAL_SECRET}
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9000}
      - S3_BUCKET=onb
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      server:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=onb
      - MYSQL_USER=onb
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD in .env}
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD in .env}
    ports:
      - "3307:3306"  # host 3307 to avoid clashing with a local MySQL on 3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mysql_data:
  redis_data:
  minio_data:
