[project]
name = "onb"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.133.1",
    "firebase-admin>=7.2.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.3.0",
    "uvicorn>=0.41.0",
    "openai>=1.30.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "weasyprint>=62.0",
    "resend>=2.0.0",
    "python-socketio[asyncio_client]>=5.11",
    "stripe>=10.0.0",
    "dnspython>=2.6.0",
    "arq>=0.26.0",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
